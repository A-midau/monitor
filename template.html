<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digest</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--fg:#1d1d1b;--mut:#77766f;--line:#e8e6e0;--acc:#4f46e5;
--model:#7c3aed;--tool:#0d9488;--video:#dc2626;--discussion:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--fg:#ecebe7;--mut:#8f8e87;--line:#2c2c29;--acc:#818cf8;
--model:#a78bfa;--tool:#2dd4bf;--video:#f87171;--discussion:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 16px 72px}
header{margin-bottom:20px}
h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--mut);
padding:5px 12px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.item{position:relative;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);
border-radius:14px;padding:12px 14px;margin-bottom:8px;color:inherit;text-decoration:none;transition:border-color .15s}
.item:hover{border-color:var(--mut)}
.item img{width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.body{min-width:0;flex:1}
.meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:3px;flex-wrap:wrap}
.tag{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tag.model{color:var(--model)}.tag.tool{color:var(--tool)}.tag.video{color:var(--video)}.tag.discussion{color:var(--discussion)}
.title{font-weight:550;line-height:1.3}
.dot{display:none;position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.item.new .dot{display:block}
.empty,.issues,footer{color:var(--mut);font-size:13px}
.issues{margin-top:24px}
footer{text-align:center;margin-top:28px}
@media(max-width:480px){.item img{width:88px}}
</style></head><body><main>
<header><h1>Digest</h1><div class="sub" id="sub"></div></header>
<div class="chips" id="chips">
<button class="on" data-f="all">All</button><button data-f="model">Models</button>
<button data-f="tool">Tools</button><button data-f="video">Videos</button><button data-f="discussion">Discussion</button></div>
<div id="list">{{ROWS}}</div>
<footer id="end"></footer>
{{ERRORS}}
</main>
<script>
const UPDATED={{UPDATED}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-t)/6e4));return m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
let prev=0;
try{prev=+(sessionStorage.getItem("prev")||localStorage.getItem("last")||0);sessionStorage.setItem("prev",prev);localStorage.setItem("last",Date.now())}catch(e){}
let fresh=0;
$$(".item").forEach(a=>{const t=+a.dataset.ts;a.querySelector(".when").textContent="· "+ago(t);if(prev&&t>prev){a.classList.add("new");fresh++}});
$("#sub").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+
 " · updated "+ago(UPDATED)+(fresh?" · "+fresh+" new since your last visit":"");
$("#chips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 $$("#chips button").forEach(x=>x.classList.toggle("on",x===b));
 $$(".item").forEach(a=>a.style.display=(b.dataset.f==="all"||a.dataset.type===b.dataset.f)?"":"none")});
$("#end").textContent=$$(".item").length?"That's everything. You're caught up.":"";
</script></body></html>
